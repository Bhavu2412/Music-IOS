# Tests on a simulator, then builds an unsigned Music.ipa for iPhone with
# scripts/build-ios.sh (the same script used locally) to prove the device build.
#
# No signing here on purpose: signing on a runner needs provisioning profiles from
# the paid Apple Developer Program. With the free Personal Team, sign locally:
#   DEVELOPMENT_TEAM=PVTW2MVJ85 bash scripts/build-ios.sh   → output/ios/Music.ipa
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26 # Xcode 26, same major as the dev Macs
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Unit tests
        run: |
          # Newest iOS runtime's first iPhone; simulator names change between Xcode images.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if ".iOS-" in runtime
                     for d in devices[runtime] if d["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcodebuild test -project Music.xcodeproj -scheme Music \
            -destination "id=$UDID" -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" -quiet

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/Tests.xcresult

  device:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build Music-unsigned.ipa
        run: bash scripts/build-ios.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: output/ios/
          if-no-files-found: error
