name: Music
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # One knob for every identifier: com.x.Music, com.x.Music.Widgets, group.com.x.Music.
    # scripts/build-ios.sh and CI override it (CI derives it from the provisioning profile).
    BUNDLE_ID_PREFIX: com.yourcompany
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).Music

targets:
  Music:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Music
        AppGroupID: $(APP_GROUP_ID)
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Music.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Utilities
      - path: ViewModels
      - path: Views
      - path: Intents
    settings:
      base:
        PRODUCT_NAME: Music
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Music
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_SPECIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTABILITY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: MusicWidgetsExtension

  MusicWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Music Widgets"
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/MusicWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    sources:
      - path: Widgets
      - path: Services/WidgetDataService.swift
      - path: Intents/MusicAppIntents.swift
    settings:
      base:
        PRODUCT_NAME: MusicWidgetsExtension
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Music.Widgets
        PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROFILE_SPECIFIER)
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  MusicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Tests/Info.plist
    sources:
      - path: Tests
    dependencies:
      - target: Music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).MusicTests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  Music:
    build:
      targets:
        Music: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusicTests
  MusicWidgetsExtension:
    build:
      targets:
        MusicWidgetsExtension: all
