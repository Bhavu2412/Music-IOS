name: Music
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Music:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Music
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Music.entitlements
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Utilities
      - path: ViewModels
      - path: Views
      - path: Intents
    settings:
      base:
        PRODUCT_NAME: Music
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.Music
        ENABLE_TESTABILITY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: MusicWidgetsExtension

  MusicWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Music Widgets"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/MusicWidgets.entitlements
    sources:
      - path: Widgets
      - path: Services/WidgetDataService.swift
    settings:
      base:
        PRODUCT_NAME: MusicWidgetsExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.Music.Widgets
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  MusicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Tests/Info.plist
    sources:
      - path: Tests
    dependencies:
      - target: Music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.MusicTests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  Music:
    build:
      targets:
        Music: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MusicTests
  MusicWidgetsExtension:
    build:
      targets:
        MusicWidgetsExtension: all
